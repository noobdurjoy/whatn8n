# nginx site for the dashboard. install.sh copies this to
# /etc/nginx/sites-available/support.wamsg.site; certbot then adds the
# HTTPS server block and the http -> https redirect.
server {
    listen 75.119.130.7:80;
    server_name support.wamsg.site;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Live inbox updates use server-sent events.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
